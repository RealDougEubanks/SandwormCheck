# ---------------------------------------------------------------------------
CONTENT|CONFIRMED|SH25-N001|npm-cache.com|Worm C2 / fake registry domain
CONTENT|CONFIRMED|SH25-N002|pypi-get.com|Campaign staging domain
CONTENT|CONFIRMED|SH25-N003|js-mirror.com|Campaign staging domain

