PATHEXISTS|SUSPECT|SH25-T001|/tmp/bun-dl-*|Bun runtime download staging directory used by the loader
PATHEXISTS|CONFIRMED|SH25-T002|/tmp/tmp.dpkg_14527.lock|Worm execution lock file
FILENAME|CONFIRMED|SH25-T003|tmp.dpkg_14527.lock|Worm execution lock file, any location

# ---------------------------------------------------------------------------
# Attribution and exfiltration markers
# ---------------------------------------------------------------------------
# Scoped to code and IDE config. These strings are embedded in the payload bundle,
# but they also appear in anything that RECORDS the investigation: AI assistant
# transcripts, shell history, incident notes, a saved vendor advisory, and this
# scanner's own --json report. All of those were reported as CONFIRMED COMPROMISE
# before scoping. A .jsonl transcript or a .log is not where a payload lives.
CONTENT|CONFIRMED|SH25-M001|[**/*.js,**/*.mjs,**/*.cjs,**/*.ts,**/settings.json,**/tasks.json] Shai-Hulud: Here We Go Again|Exfiltration repository description / campaign self-identifier
CONTENT|CONFIRMED|SH25-M002|[**/*.js,**/*.mjs,**/*.cjs,**/*.ts,**/settings.json,**/tasks.json] IfYouBlockThisAPIKeyItWillCrashTheLiveProductionServersOfAllThirdPartyClients|Embedded threat string unique to this payload

