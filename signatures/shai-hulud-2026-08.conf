# ---------------------------------------------------------------------------
# Repository-level IDE autostart hooks.
# These execute without any npm install, so they are a live persistence vector
# in a working tree even if node_modules was wiped.
# ---------------------------------------------------------------------------
# `setup.mjs` is a common, legitimate filename, so it is matched only inside the
# specific directories the worm writes to — never on basename alone. Confirm any hit
# against the SHA-256/SHA-1 loader hashes above before declaring compromise.
PATHGLOB|CONFIRMED|SH25-R001|**/.claude/setup.mjs|Loader script injected into the Claude Code config directory
PATHGLOB|CONFIRMED|SH25-R002|**/.vscode/setup.mjs|Loader script injected into the VS Code config directory
CONTENT|CONFIRMED|SH25-R003|[**/settings.json,**/tasks.json,**/package.json,**/*.mjs,**/*.cjs,**/*.js] math_init|Reference to the stage-two payload inside an IDE config or package manifest
# REMOVED: CONTENT|SUSPECT|SH25-R004|setup.mjs
# A bare "setup.mjs" content match produced 28 false positives on a single
# developer machine: emdash ships dist/astro/middleware/setup.mjs, motion-dom
# ships gestures/utils/setup.mjs, and source maps plus package.json files
# reference the name in passing. The PATHGLOB records above already match the two
# directories the worm actually writes to, and the loader hashes confirm a hit, so
# this signature contributed nothing but noise. A signature that fires on clean
# machines trains operators to ignore the tool.

# ---------------------------------------------------------------------------
# Host persistence: gh-token-monitor dead-man's switch.
# Polls the GitHub API every 60s and evaluates a remote-supplied handler
# command when the stolen token is revoked.
# ---------------------------------------------------------------------------
PATHEXISTS|CONFIRMED|SH25-P001|~/.config/gh-token-monitor|Dead-man's-switch state directory (stolen token + remote handler)
PATHEXISTS|CONFIRMED|SH25-P002|~/.config/gh-token-monitor/token|Stolen GitHub token staged by the worm
PATHEXISTS|CONFIRMED|SH25-P003|~/.config/gh-token-monitor/handler|Attacker-supplied handler command
PATHEXISTS|CONFIRMED|SH25-P004|~/.local/bin/gh-token-monitor.sh|Token-revocation watcher script
PATHEXISTS|CONFIRMED|SH25-P005|~/Library/LaunchAgents/com.user.gh-token-monitor.plist|macOS LaunchAgent persistence
PATHEXISTS|CONFIRMED|SH25-P006|~/.config/systemd/user/gh-token-monitor.service|Linux systemd user-unit persistence
FILENAME|CONFIRMED|SH25-P007|gh-token-monitor.sh|Token-revocation watcher script, any location
CONTENT|CONFIRMED|SH25-P008|[**/*.plist,**/*.service,**/*.timer,**/settings.json,**/tasks.json,**/.bashrc,**/.zshrc,**/.profile,**/.bash_profile,**/*.sh] gh-token-monitor|Persistence component referenced in a config or unit file

# ---------------------------------------------------------------------------
# Live implant processes.
#
# The dead-man's switch polls GitHub every 60 seconds, so it can still be running
# after its files are deleted -- by an incomplete cleanup, or by the payload's own
# 24-hour TTL self-destruct. Without a process check, such a host reports CLEAN.
# Findings name the PID only, never the command line, which can contain
# credentials passed as arguments.
# ---------------------------------------------------------------------------
PROCESS|CONFIRMED|SH25-X001|gh-token-monitor|Dead-man's-switch watcher process is running
PROCESS|CONFIRMED|SH25-X002|Math_Symbol.js|Stage-two payload is executing
PROCESS|CONFIRMED|SH25-X003|math_init.js|Stage-two payload is executing (repository variant)

