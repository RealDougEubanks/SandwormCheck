# ---------------------------------------------------------------------------
# Stage-two payload files (dropped Bun bundle, ~728 KB)
# ---------------------------------------------------------------------------
# The loader drops the payload directly into a package directory
# (node_modules/keyv/Math_Symbol.js per Wiz). Matching the basename alone reported
# every host running Babel as compromised: regenerate-unicode-properties -- a
# transitive dependency of @babel/plugin-transform-* and so present in a large
# share of all JS projects -- legitimately ships
# General_Category/Math_Symbol.js, a 1 KB Unicode codepoint list. Math_Symbol is
# the real Unicode category Sm; the worm almost certainly chose the name to blend
# into exactly those dependency trees.
#
# Two discriminators, either of which is sufficient on its own:
#   * position -- the payload sits at a package ROOT, the Unicode file one level
#     deeper under General_Category/;
#   * size -- the payload is a ~728 KB Bun bundle, the Unicode file about 1 KB.
PATHGLOB|CONFIRMED|SH25-F001|>=102400 **/node_modules/*/Math_Symbol.js|Stage-two Bun payload bundle at a package root
PATHGLOB|CONFIRMED|SH25-F001b|>=102400 **/node_modules/@*/*/Math_Symbol.js|Stage-two Bun payload bundle at a scoped package root
PATHGLOB|CONFIRMED|SH25-F002|>=102400 **/node_modules/*/math_init.js|Stage-two payload, repository-injected variant
PATHGLOB|CONFIRMED|SH25-F002b|>=102400 **/node_modules/@*/*/math_init.js|Stage-two payload, repository-injected variant, scoped package
# Outside node_modules the names are distinctive enough to report on their own,
# still gated on being large enough to be the bundle rather than a data file.
PATHGLOB|SUSPECT|SH25-F003|>=102400 **/Math_Symbol.js|A file named like the payload, outside node_modules
PATHGLOB|SUSPECT|SH25-F004|>=102400 **/math_init.js|A file named like the payload, outside node_modules

